  <rect x="11" y="22" width="16" height="22" rx="3" fill="#e6ad5f"/>
  <rect x="37" y="22" width="16" height="22" rx="3" fill="#b992e4"/>
  <rect x="19" y="13" width="26" height="38" rx="5.5" fill="#0e1a19"/>
  <rect x="21.75" y="15.75" width="20.5" height="32.5" rx="3.5" fill="none" stroke="#2ec4b6" stroke-width="2.5"/>
  <rect x="25" y="19" width="14" height="26" rx="2" fill="#a6cf6e"/>
