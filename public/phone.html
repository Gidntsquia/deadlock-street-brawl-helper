<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Brawl advice</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14181f; color: #e8e2d0; font: 16px/1.4 Nunito, "Segoe UI", system-ui, sans-serif; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; opacity: .75; font-weight: 700; display: flex; justify-content: space-between; }
  .muted { opacity: .7; font-size: 14px; margin: 6px 0; }
  .card { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; background: rgba(203,189,159,.12); border: 2px solid rgba(203,189,159,.25); margin-bottom: 10px; }
  .card.best { background: rgba(98,182,200,.18); border-color: #62b6c8; box-shadow: 0 0 0 3px rgba(98,182,200,.25); }
  .card img { width: 64px; height: 64px; border-radius: 10px; background: #000; object-fit: cover; }
  .card b { font-size: 20px; display: block; }
  .card.best b { color: #62b6c8; }
  .card small { display: block; font-size: 13px; opacity: .8; }
  .reroll { padding: 10px; border-radius: 10px; background: rgba(217,138,43,.18); border: 1px solid #d98a2b; font-size: 14px; font-weight: 700; }
  form { display: grid; gap: 10px; max-width: 320px; }
  input { font: inherit; font-size: 22px; letter-spacing: .1em; text-transform: uppercase; padding: 10px; border-radius: 10px; border: 1px solid rgba(203,189,159,.4); background: #0f1319; color: inherit; }
  button { font: inherit; font-weight: 700; padding: 12px; border-radius: 10px; border: 0; background: #62b6c8; color: #0f1319; }
</style></head><body>
<h1><span id="hero">Brawl advice</span><span id="live"></span></h1>
<div id="root" class="muted"></div>
<script>
  // Companion display for the Brawl tab: the PC publishes its advice to a random ntfy.sh topic, this page subscribes.
  // URL: phone.html#t=<code>  (optional &s=<ntfy server> for tests). Without a code the page asks for it.
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const params = new URLSearchParams(location.hash.slice(1));
  const server = (params.get('s') || 'https://ntfy.sh').replace(/\/$/, '');
  const code = (params.get('t') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const root = document.getElementById('root');
  const render = (s) => {
    document.getElementById('hero').textContent = s.hero ? s.hero + ' · round ' + s.round + ', choice ' + s.choice : 'Brawl advice';
    let h = '';
    if (s.took) h += '<div class="muted">Took ' + esc(s.took) + ' · ' + s.ownedCount + ' owned</div>';
    if (!s.cards || !s.cards.length) h += '<div class="muted">' + esc(s.status || 'Waiting for the draft screen…') + '</div>';
    for (const [k, c] of (s.cards || []).entries()) {
      h += '<div class="card' + (k === 0 ? ' best' : '') + '">' + (c.icon ? '<img src="' + esc(c.icon) + '" alt="" onerror="this.hidden=true">' : '<span></span>') +
        '<span><b>' + (k === 0 ? 'TAKE ' : '#' + (k + 1) + ' ') + esc(c.name) + (c.enhanced ? ' (enhanced)' : '') + '</b>' +
        '<small>score ' + Number(c.score).toFixed(2) + (c.usage != null ? ' · used by ' + Math.round(c.usage * 100) + '%' : '') + (c.winRate != null ? ', wins ' + Math.round(c.winRate * 100) + '%' : '') + '</small>' +
        (c.why && c.why.length ? '<small>' + esc(c.why.join('; ')) + '</small>' : '') + '</span></div>';
    }
    if (s.reroll) h += '<div class="reroll">Re-roll this set: best card ' + s.reroll.currentBest.toFixed(2) + ', a fresh tier-' + s.reroll.tier + ' set should offer ' + s.reroll.expectedBest.toFixed(2) + (s.reroll.holdValue > 0 ? ' (saving it for a later set is worth ' + s.reroll.holdValue.toFixed(2) + ')' : '') + '</div>';
    else if (s.cards && s.cards.length) h += '<div class="muted">Keep this set.</div>';
    root.innerHTML = h;
  };
  if (!code) {
    root.innerHTML = '<form><label>Type the code shown under "Phone display" in the app\'s Brawl tab.</label><input name="t" autocomplete="off" autocapitalize="characters" placeholder="code" required><button>Connect</button></form>';
    root.querySelector('form').onsubmit = (e) => { e.preventDefault(); location.hash = 't=' + e.target.t.value.trim().toLowerCase().replace(/[^a-z0-9]/g, ''); location.reload(); };
  } else {
    root.textContent = 'Waiting for the PC. Turn on "Phone display" in the app\'s Brawl tab.';
    const live = document.getElementById('live');
    live.textContent = 'connecting…';
    const connect = () => {
      // since=12h replays the most recent state so a phone that joins late shows the current advice at once
      const es = new EventSource(server + '/brawl-' + code + '/sse?since=12h');
      es.onopen = () => { live.textContent = 'live'; };
      es.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.event === 'message') render(JSON.parse(m.message)); } catch {} };
      es.onerror = () => { live.textContent = 'reconnecting…'; es.close(); setTimeout(connect, 3000); };
    };
    connect();
    let wake = null; // keep the phone screen on while the page is open
    const keepAwake = async () => { try { wake = await navigator.wakeLock?.request('screen'); } catch {} };
    keepAwake(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  }
</script></body></html>
